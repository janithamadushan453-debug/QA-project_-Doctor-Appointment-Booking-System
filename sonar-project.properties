
# =====================================
# Doctor Appointment Booking System
# SonarQube Configuration
# =====================================

sonar.projectKey=doctor-appointment-system
sonar.projectName=Doctor Appointment Booking System
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# =====================================
# Production Source Code
# =====================================

sonar.sources=backend/controllers,backend/models,backend/routes,backend/middleware,backend/config,backend/scripts,backend/server.js,frontend/src

# =====================================
# Test Source Code
# =====================================

sonar.tests=backend/tests,backend/features

sonar.test.inclusions=**/*.test.js,**/*.steps.js

# =====================================
# Exclusions
# =====================================

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.env,**/.env.*,**/.git/**

# =====================================
# Jest LCOV Coverage
# =====================================

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
